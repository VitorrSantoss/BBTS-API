spring.application.name=bbts-api

# Segredos locais (senha do banco etc.) ficam em application-local.properties, ignorado pelo git.
spring.config.import=optional:classpath:application-local.properties

# --- CONFIGURAÇÃO MYSQL (local) ---
# createDatabaseIfNotExist cria o banco "bbts" na primeira subida.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bbts?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- AJUSTES DE ESQUEMA ---
# O ddl-auto=update não remove NOT NULL de colunas que já existem no banco.
# O db/ajustes.sql roda depois do Hibernate, a cada subida, e é idempotente.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/ajustes.sql

# --- CARGA INICIAL ---
# Catálogo SFIA, cursos e (uma vez só) equipes e dados de exemplo. Ver config/CargaInicial.java.
bbts.carga-inicial=${CARGA_INICIAL:true}

# --- UPLOAD ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JWT ---
jwt.secret=${JWT_SECRET:aWdY#k&%qP4vF8@uT!sJ9z$G2cR*bN6mH7e^L5pDaWdY#k&%qP4vF8@uT!sJ9z$G2}
jwt.expiration=28800000

server.port=${PORT:8080}
